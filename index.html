<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEW Monitor System - Broadcast Edition</title>
    <style>
        :root {
            --bg-dark: #111622;
            --sidebar-bg: #1a2233;
            --accent-red: #e81b23;
            --warning-orange: #ff9f43;
            --shindo-5-bg: #d63031;
            --shindo-6-bg: #8e44ad;
            --text-white: #ffffff;
            --text-gray: #a4b0be;
            --border-color: rgba(255,255,255,0.08);
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex;
        }

        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            z-index: 10;
        }

        .map-container {
            flex-grow: 1;
            position: relative;
            background: #1e272e;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-tag {
            background: #2f3542;
            color: white;
            font-weight: bold;
            padding: 8px 12px;
            font-size: 14px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease;
        }

        .status-dot {
            width: 8px; height: 8px;
            background: #747d8c;
            border-radius: 50%;
            display: inline-block;
        }
        .connected { background: #2ed573; }

        .location-box {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .location-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--text-white);
        }

        .time-stamp {
            font-size: 11px;
            color: var(--text-gray);
        }

        .metric-row {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.1);
        }

        .metric-box {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-right: 1px solid var(--border-color);
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-gray);
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
        }

        .shindo-hero-panel {
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-color);
        }

        .shindo-badge {
            display: inline-block;
            font-size: 72px;
            font-weight: 900;
            width: 110px;
            height: 110px;
            line-height: 110px;
            border-radius: 12px;
            background: #2f3542; 
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .tsunami-banner {
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            background: #2f3542;
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 0.5px;
            transition: background 0.3s ease;
        }

        .history-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .history-title {
            font-size: 11px;
            color: var(--text-gray);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .history-item {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--text-gray);
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 0 4px 4px 0;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        .map-clock {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.75);
            padding: 8px 15px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px solid var(--border-color);
            z-index: 5;
        }

        #japan-map {
            width: 100%;
            height: 100%;
        }

        /* --- EQLEVEL2 OVERLAY COMPONENT (From 1000851570.png) --- */
        .level-monitor-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: #000000;
            border: 1px solid var(--border-color);
            padding: 15px;
            width: 160px;
            box-sizing: border-box;
            border-radius: 4px;
            font-family: 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            z-index: 5;
        }

        .lvl-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        
        .lvl-red   { color: #ff0000; }
        .lvl-yellow{ color: #ffcc00; }
        .lvl-green { color: #00ff00; }

        .lvl-label-vibe {
            font-size: 18px;
            font-weight: bold;
            margin-top: 12px;
            color: #ffffff;
        }

        .lvl-value-vibe {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin-top: 2px;
        }

        .map-legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(26, 34, 51, 0.9);
            padding: 12px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid var(--border-color);
        }

        .legend-row { display: flex; align-items: center; margin-bottom: 4px; }
        .legend-color { width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; }
    </style>
</head>
<body>

    <!-- LEFT DATA SIDEBAR -->
    <div class="sidebar">
        <div class="header-tag" id="alert-header">
            <span>地震監視システム</span>
            <span class="status-dot" id="status-node"></span>
        </div>

        <div class="location-box">
            <div class="location-title" id="eq-location">待機中</div>
            <div class="time-stamp" id="eq-time">----/--/-- --:--:--</div>
        </div>

        <div class="shindo-hero-panel">
            <div class="metric-label" style="margin-bottom: 8px; font-size: 12px;">最大震度</div>
            <div class="shindo-badge" id="main-shindo">-</div>
        </div>

        <div class="metric-row">
            <div class="metric-box">
                <div class="metric-label">マグニチュード</div>
                <div class="metric-value" id="main-mag">-.-</div>
            </div>
            <div class="metric-box" style="border-right: none;">
                <div class="metric-label">深さ</div>
                <div class="metric-value" id="main-depth">-km</div>
            </div>
        </div>

        <div class="tsunami-banner" id="tsunami-alert">
            津波情報なし
        </div>

        <div class="history-list">
            <div class="history-title">地震履歴</div>
            <div id="history-container"></div>
        </div>
    </div>

    <!-- MAIN MONITOR SCREEN -->
    <div class="map-container">
        <div class="map-clock" id="live-clock">0000/00/00 00:00:00</div>
        
        <canvas id="japan-map"></canvas>

        <!-- Dynamic EQLevel2 Status Panel -->
        <div class="level-monitor-panel">
            <div class="lvl-row lvl-red"><span>赤 :</span><span id="stat-red">0</span></div>
            <div class="lvl-row lvl-yellow"><span>黄 :</span><span id="stat-yellow">0</span></div>
            <div class="lvl-row lvl-green"><span>緑 :</span><span id="stat-green">450</span></div>
            <div class="lvl-label-vibe">振動レベル</div>
            <div class="lvl-value-vibe" id="stat-vibe">Lv.0</div>
        </div>

        <!-- Dynamic Map Legend Panel -->
        <div class="map-legend">
            <div style="font-weight: bold; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 3px;">震度階級</div>
            <div class="legend-row"><div class="legend-color" style="background:#8e44ad;"></div>震度 6強 / 6弱</div>
            <div class="legend-row"><div class="legend-color" style="background:#d63031;"></div>震度 5強 / 5弱</div>
            <div class="legend-row"><div class="legend-color" style="background:#ff9f43;"></div>震度 4</div>
            <div class="legend-row"><div class="legend-color" style="background:#fed330;"></div>震度 3</div>
            <div class="legend-row"><div class="legend-color" style="background:#26de81;"></div>震度 2</div>
            <div class="legend-row"><div class="legend-color" style="background:#0fedf7;"></div>震度 1</div>
        </div>
    </div>

    <script>
        // --- MASTER SOUND CONTROLLER ---
        function triggerSound(soundName) {
            console.log(`[AUDIO TRIGGER]: Playing ${soundName}.mp3`);
            const audio = new Audio(`./${soundName}.mp3`);
            audio.play().catch(e => console.log("Audio playback blocked until user interacts with page."));
        }

        // --- TEXT TO SPEECH ---
        function speakAlert(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'ja-JP'; 
                msg.rate = 1.1;
                window.speechSynthesis.speak(msg);
            }
        }

        // --- MAP ENGINE & TELEMETRY ---
        const canvas = document.getElementById('japan-map');
        const ctx = canvas.getContext('2d');
        let stations = [];
        let activeWave = null;

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            generateNiedStations();
        }

        function generateNiedStations() {
            stations = [];
            const totalNodes = 450; 
            for(let i=0; i<totalNodes; i++) {
                stations.push({
                    x: canvas.width * 0.3 + (Math.sin(i * 0.05) * 120) + (i * 0.6),
                    y: canvas.height * 0.15 + (i * 1.4) - (Math.cos(i*0.1)*30),
                    currentColor: '#00ff00', // Default green safe state matching panel
                    state: 'green'
                });
            }
            updateMetricOverlay();
        }

        function triggerWavePropagation(epicenterX, epicenterY) {
            activeWave = { x: epicenterX, y: epicenterY, pRadius: 0, sRadius: 0, maxRadius: Math.max(canvas.width, canvas.height) };
        }

        function updateMetricOverlay() {
            let redCount = 0;
            let yellowCount = 0;
            let greenCount = 0;

            stations.forEach(node => {
                if (node.state === 'red') redCount++;
                else if (node.state === 'yellow') yellowCount++;
                else greenCount++;
            });

            document.getElementById('stat-red').innerText = redCount;
            document.getElementById('stat-yellow').innerText = yellowCount;
            document.getElementById('stat-green').innerText = greenCount;

            // Calculate aggregate vibration logic based on non-green nodes active
            let activeWeight = (redCount * 4) + (yellowCount * 1);
            let targetLvl = Math.min(Math.floor(activeWeight / 4), 99);
            document.getElementById('stat-vibe').innerText = `Lv.${targetLvl}`;
        }

        function drawMapLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255,255,255,0.02)';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            if(activeWave) {
                activeWave.pRadius += 3.5; 
                activeWave.sRadius += 1.8; 

                ctx.beginPath(); ctx.arc(activeWave.x, activeWave.y, activeWave.pRadius, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(15, 237, 247, 0.4)'; ctx.stroke();

                ctx.beginPath(); ctx.arc(activeWave.x, activeWave.y, activeWave.sRadius, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(232, 27, 35, 0.6)'; ctx.fillStyle = 'rgba(232, 27, 35, 0.04)';
                ctx.fill(); ctx.stroke();

                stations.forEach(node => {
                    const dist = Math.hypot(node.x - activeWave.x, node.y - activeWave.y);
                    if(dist < activeWave.pRadius && dist > activeWave.sRadius) {
                        node.currentColor = '#ffcc00'; // Yellow alert boundary
                        node.state = 'yellow';
                    }
                    else if(dist < activeWave.sRadius) {
                        node.currentColor = '#ff0000'; // Critical red boundary
                        node.state = 'red';
                    }
                });
                
                updateMetricOverlay();

                if(activeWave.sRadius > activeWave.maxRadius) {
                    activeWave = null;
                    // Reset matrix to resting safe profile once wave clears outward
                    setTimeout(() => {
                        stations.forEach(n => { n.currentColor = '#00ff00'; n.state = 'green'; });
                        updateMetricOverlay();
                    }, 4000);
                }
            }

            stations.forEach(node => {
                ctx.beginPath(); ctx.arc(node.x, node.y, 3, 0, Math.PI*2);
                ctx.fillStyle = node.currentColor; ctx.fill();
            });
            requestAnimationFrame(drawMapLoop);
        }

        // --- DATA INTERPRETATION ENGINE ---
        let lastIssueId = "";
        let lastSerial = 0;

        async function bootLatestData() {
            try {
                const res = await fetch('https://api.wolfx.jp/jma_eqlist.json');
                const data = await res.json();
                if(data && data["1"]) {
                    updateUI(data["1"], false, false);
                }
                
                const container = document.getElementById('history-container');
                container.innerHTML = "";
                for(let i=2; i<=7; i++) {
                    if(data[i.toString()]) {
                        const item = data[i.toString()];
                        const div = document.createElement('div');
                        div.className = 'history-item';
                        div.innerHTML = `<span>${item.location}</span><span style="font-weight:bold; color:var(--warning-orange);">震度 ${item.shindo}</span>`;
                        container.appendChild(div);
                    }
                }
            } catch(e) { console.log("Initial history pull skipped."); }
        }

        function updateUI(dataset, isLiveEEW, isP2PReport) {
            document.getElementById('eq-location').innerText = dataset.location || dataset.Hypocenter || "情報なし";
            document.getElementById('eq-time').innerText = `${dataset.time || dataset.EventTime || '----/--/-- --:--'} 発表`;
            
            const shindo = dataset.shindo || dataset.MaxIntensity || "-";
            const badge = document.getElementById('main-shindo');
            badge.innerText = shindo;

            if(shindo.includes('6') || shindo.includes('7')) {
                badge.style.background = 'var(--shindo-6-bg)';
                document.getElementById('alert-header').style.background = 'var(--accent-red)';
            } else if(shindo.includes('5')) {
                badge.style.background = 'var(--shindo-5-bg)';
                document.getElementById('alert-header').style.background = 'var(--warning-orange)';
            } else if(shindo !== "-") {
                badge.style.background = '#26de81';
                document.getElementById('alert-header').style.background = '#2f3542';
            }
            
            document.getElementById('main-mag').innerText = dataset.magnitude || dataset.Magunitude || "-.-";
            document.getElementById('main-depth').innerText = dataset.depth || dataset.Depth || "---";
        }

        // --- REAL-TIME WEBSOCKET HANDSHAKES ---
        function connectWebSockets() {
            const wolfx = new WebSocket('wss://ws-api.wolfx.jp/jma_eew');
            
            wolfx.onopen = () => {
                document.getElementById('status-node').classList.add('connected');
                document.getElementById('alert-header').innerText = "緊急地震速報 (常時監視中)";
            };

            wolfx.onmessage = (e) => {
                const packet = JSON.parse(e.data);
                if(packet.type !== "jma_eew") return;

                document.getElementById('alert-header').innerText = `緊急地震速報 (#${packet.Serial})`;
                document.getElementById('alert-header').style.background = 'var(--accent-red)';
                
                updateUI(packet, true, false);

                const currentShindo = packet.MaxIntensity || "-";
                const isWarn = packet.isWarn || false;
                const serial = parseInt(packet.Serial) || 1;
                const isFinal = packet.isFinal || false;

                if (packet.EventID !== lastIssueId || serial === 1) {
                    lastIssueId = packet.EventID;
                    triggerSound('quake1');
                    triggerWavePropagation(canvas.width * 0.5, canvas.height * 0.45);
                    speakAlert(`緊急地震速報。${packet.Hypocenter}で地震が発生。`);

                    if (["3", "4", "5-", "5+", "6-", "6+", "7"].some(s => currentShindo.includes(s))) {
                        setTimeout(() => triggerSound('quake3'), 800);
                    }

                    if (isWarn || ["5-", "5+", "6-", "6+", "7"].some(s => currentShindo.includes(s))) {
                        setTimeout(() => triggerSound('quake5'), 1500);
                    }
                } 
                else if (serial > lastSerial && !isFinal) {
                    triggerSound('update');
                }

                if (isFinal) {
                    triggerSound('updatef');
                }

                if (packet.LPGMInfo) {
                    triggerSound('lpgm');
                }

                lastSerial = serial;
            };

            wolfx.onclose = () => {
                document.getElementById('status-node').classList.remove('connected');
                setTimeout(connectWebSockets, 5000); 
            };

            const p2p = new WebSocket('wss://api.p2pquake.net/v2/ws');
            p2p.onmessage = (e) => {
                const raw = JSON.parse(e.data);

                if (raw.code === 551) {
                    triggerSound('info');
                    if (raw.earthquake && raw.earthquake.hypocenter) {
                        triggerSound('infoepi');
                    }
                    if (raw.points && raw.points.length > 0) {
                        setTimeout(() => triggerSound('finalinfo'), 2000);
                    }
                }
