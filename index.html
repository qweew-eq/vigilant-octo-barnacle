<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScREV_</title>
    <style>
        :root {
            --bg-dark: #111622;
            --sidebar-bg: #1a2233;
            --accent-red: #e81b23;
            --warning-orange: #ff9f43;
            --shindo-5-bg: #d63031;
            --shindo-6-bg: #8e44ad;
            --text-white: #ffffff;
            --text-gray: #a4b0be;
            --border-color: rgba(255,255,255,0.08);
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex;
        }

        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            z-index: 10;
        }

        .map-container {
            flex-grow: 1;
            position: relative;
            background: #1e272e;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-tag {
            background: #2f3542;
            color: white;
            font-weight: bold;
            padding: 8px 12px;
            font-size: 14px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease;
        }

        .status-dot {
            width: 8px; height: 8px;
            background: #747d8c;
            border-radius: 50%;
            display: inline-block;
        }
        .connected { background: #2ed573; }

        .location-box {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .location-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--text-white);
        }

        .time-stamp {
            font-size: 11px;
            color: var(--text-gray);
        }

        .metric-row {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.1);
        }

        .metric-box {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-right: 1px solid var(--border-color);
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-gray);
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
        }

        .shindo-hero-panel {
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-color);
        }

        .shindo-badge {
            display: inline-block;
            font-size: 72px;
            font-weight: 900;
            width: 110px;
            height: 110px;
            line-height: 110px;
            border-radius: 12px;
            background: #2f3542; 
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .tsunami-banner {
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            background: #2f3542;
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 0.5px;
            transition: background 0.3s ease;
        }

        .history-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .history-title {
            font-size: 11px;
            color: var(--text-gray);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .history-item {
            background: rgba(255,255,255,0.03);
            border-left: 4px solid var(--text-gray);
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 0 4px 4px 0;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        .map-clock {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.75);
            padding: 8px 15px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px solid var(--border-color);
            z-index: 5;
        }

        #japan-map {
            width: 100%;
            height: 100%;
        }

        /* --- EQLEVEL2 OVERLAY COMPONENT (From 1000851570.png) --- */
        .level-monitor-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: #000000;
            border: 1px solid var(--border-color);
            padding: 15px;
            width: 160px;
            box-sizing: border-box;
            border-radius: 4px;
            font-family: 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            z-index: 5;
        }

        .lvl-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        
        .lvl-red   { color: #ff0000; }
        .lvl-yellow{ color: #ffcc00; }
        .lvl-green { color: #00ff00; }

        .lvl-label-vibe {
            font-size: 18px;
            font-weight: bold;
            margin-top: 12px;
            color: #ffffff;
        }

        .lvl-value-vibe {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin-top: 2px;
        }

        .map-legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(26, 34, 51, 0.9);
            padding: 12px;
            border-radius: 6px;
            font-size: 11px;
            border: 1px solid var(--border-color);
        }

        .legend-row { display: flex; align-items: center; margin-bottom: 4px; }
        .legend-color { width: 12px; height: 12px; border-radius: 2px; margin-right: 8px; }
    </style>
</head>
<body>

    <!-- LEFT DATA SIDEBAR -->
    <div class="sidebar">
        <div class="header-tag" id="alert-header">
            <span>地震監視システム</span>
            <span class="status-dot" id="status-node"></span>
        </div>

        <div class="location-box">
            <div class="location-title" id="eq-location">待機中</div>
            <div class="time-stamp" id="eq-time">----/--/-- --:--:--</div>
        </div>

        <div class="shindo-hero-panel">
            <div class="metric-label" style="margin-bottom: 8px; font-size: 12px;">最大震度</div>
            <div class="shindo-badge" id="main-shindo">-</div>
        </div>

        <div class="metric-row">
            <div class="metric-box">
                <div class="metric-label">マグニチュード</div>
                <div class="metric-value" id="main-mag">-.-</div>
            </div>
            <div class="metric-box" style="border-right: none;">
                <div class="metric-label">深さ</div>
                <div class="metric-value" id="main-depth">-km</div>
            </div>
        </div>

        <div class="tsunami-banner" id="tsunami-alert">
            津波情報なし
        </div>

        <div class="history-list">
            <div class="history-title">地震履歴</div>
            <div id="history-container"></div>
        </div>
    </div>

    <!-- MAIN MONITOR SCREEN -->
    <div class="map-container">
        <div class="map-clock" id="live-clock">0000/00/00 00:00:00</div>
        
        <canvas id="japan-map"></canvas>

        <!-- Dynamic EQLevel2 Status Panel -->
        <div class="level-monitor-panel">
            <div class="lvl-row lvl-red"><span>赤 :</span><span id="stat-red">0</span></div>
            <div class="lvl-row lvl-yellow"><span>黄 :</span><span id="stat-yellow">0</span></div>
            <div class="lvl-row lvl-green"><span>緑 :</span><span id="stat-green">0</span></div>
            <div class="lvl-label-vibe">振動レベル</div>
            <div class="lvl-value-vibe" id="stat-vibe">Lv.0</div>
        </div>

        <!-- Dynamic Map Legend Panel -->
        <div class="map-legend">
            <div style="font-weight: bold; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 3px;">リアルタイム震度</div>
            <div class="legend-row"><div class="legend-color" style="background:#ff0000;"></div>強い揺れ (赤)</div>
            <div class="legend-row"><div class="legend-color" style="background:#ffcc00;"></div>微小な揺れ (黄)</div>
            <div class="legend-row"><div class="legend-color" style="background:#00ff00;"></div>平常・平穏 (緑)</div>
        </div>
    </div>

    <script>
        // --- MASTER AUDIO LOGIC CONFIGURATION ---
        function triggerSound(soundName) {
            console.log(`[AUDIO TRIGGER]: Playing ${soundName}.mp3`);
            const audio = new Audio(`./sounds/${soundName}.mp3`);
            audio.play().catch(e => {});
        }

        // Handle specific Shindo audio playback files cleanly
        function playShindoSound(shindoString) {
            let normalized = shindoString.trim().replace('弱', '-').replace('強', '+');
            
            // Map exact values to assets: shindo1.mp3, shindo5-.mp3, shindo6+.mp3, etc.
            const validShindos = ['1', '2', '3', '4', '5-', '5+', '6-', '6+', '7'];
            if (validShindos.includes(normalized)) {
                triggerSound(`shindo${normalized}`);
            }
        }

        // --- TEXT TO SPEECH ---
        function speakAlert(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'ja-JP'; 
                msg.rate = 1.1;
                window.speechSynthesis.speak(msg);
            }
        }

        // --- MAP ENGINE & TELEMETRY ---
        const canvas = document.getElementById('japan-map');
        const ctx = canvas.getContext('2d');
        let niedStations = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }

        function convertCoords(lat, lng) {
            const mapLngMin = 122.0; const mapLngMax = 146.0;
            const mapLatMin = 22.0;  const mapLatMax = 46.0;
            const x = ((lng - mapLngMin) / (mapLngMax - mapLngMin)) * canvas.width;
            const y = canvas.height - (((lat - mapLatMin) / (mapLatMax - mapLatMin)) * canvas.height);
            return { x, y };
        }

        async function fetchNiedData() {
            try {
                const res = await fetch('https://api.wolfx.jp/nied_kyoshin.json');
                const data = await res.json();
                
                if (data && data.items) {
                    let redCount = 0; let yellowCount = 0; let greenCount = 0;

                    niedStations = data.items.map(item => {
                        const pos = convertCoords(parseFloat(item.lat), parseFloat(item.lng));
                        const shindo = parseFloat(item.shindo);
                        
                        let color = '#00ff00'; let state = 'green';

                        if (shindo >= 0.5) {
                            color = '#ff0000'; state = 'red'; redCount++;
                        } else if (shindo >= -0.5 && shindo < 0.5) {
                            color = '#ffcc00'; state = 'yellow'; yellowCount++;
                        } else {
                            greenCount++;
                        }
                        return { x: pos.x, y: pos.y, color: color };
                    });

                    document.getElementById('stat-red').innerText = redCount;
                    document.getElementById('stat-yellow').innerText = yellowCount;
                    document.getElementById('stat-green').innerText = greenCount;

                    let vibeLevel = Math.min(Math.floor((redCount * 5) + (yellowCount * 0.5)), 99);
                    document.getElementById('stat-vibe').innerText = `Lv.${vibeLevel}`;
                }
            } catch (e) {
                console.error("NIED telemetry poll error", e);
            }
        }

        function drawMapLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255,255,255,0.015)'; ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            niedStations.forEach(node => {
                ctx.beginPath(); ctx.arc(node.x, node.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = node.color; ctx.fill();
            });
            requestAnimationFrame(drawMapLoop);
        }

        // --- DATA INTERPRETATION ENGINE ---
        let lastIssueId = "";
        let lastSerial = 0;

        async function bootLatestData() {
            try {
                const res = await fetch('https://api.wolfx.jp/jma_eqlist.json');
                const data = await res.json();
                if(data && data["1"]) { updateUI(data["1"]); }
                
                const container = document.getElementById('history-container');
                container.innerHTML = "";
                for(let i=2; i<=7; i++) {
                    if(data[i.toString()]) {
                        const item = data[i.toString()];
                        const div = document.createElement('div');
                        div.className = 'history-item';
                        div.innerHTML = `<span>${item.location}</span><span style="font-weight:bold; color:var(--warning-orange);">震度 ${item.shindo}</span>`;
                        container.appendChild(div);
                    }
                }
            } catch(e) {}
        }

        function updateUI(dataset) {
            document.getElementById('eq-location').innerText = dataset.location || dataset.Hypocenter || "情報なし";
            document.getElementById('eq-time').innerText = `${dataset.time || dataset.EventTime || '----/--/-- --:--'} 発表`;
            
            const shindo = dataset.shindo || dataset.MaxIntensity || "-";
            const badge = document.getElementById('main-shindo');
            badge.innerText = shindo;

            if(shindo.includes('6') || shindo.includes('7')) {
                badge.style.background = 'var(--shindo-6-bg)';
                document.getElementById('alert-header').style.background = 'var(--accent-red)';
            } else if(shindo.includes('5')) {
                badge.style.background = 'var(--shindo-5-bg)';
                document.getElementById('alert-header').style.background = 'var(--warning-orange)';
            } else if(shindo !== "-") {
                badge.style.background = '#26de81';
                document.getElementById('alert-header').style.background = '#2f3542';
            }
            
            document.getElementById('main-mag').innerText = dataset.magnitude || dataset.Magunitude || "-.-";
            document.getElementById('main-depth').innerText = dataset.depth || dataset.Depth || "---";
        }

        function connectWebSockets() {
            const wolfx = new WebSocket('wss://ws-api.wolfx.jp/jma_eew');
            
            wolfx.onopen = () => {
                document.getElementById('status-node').classList.add('connected');
                document.getElementById('alert-header').innerText = "緊急地震速報 (常時監視中)";
            };

            wolfx.onmessage = (e) => {
                const packet = JSON.parse(e.data);
                if(packet.type !== "jma_eew") return;

                // Handle Cancelation Packets cleanly
                if (packet.isCancel) {
                    triggerSound('cancel');
                    document.getElementById('alert-header').innerText = "緊急地震速報 (取消されました)";
                    document.getElementById('alert-header').style.background = '#747d8c';
                    return;
                }

                document.getElementById('alert-header').innerText = `緊急地震速報 (#${packet.Serial})`;
                document.getElementById('alert-header').style.background = 'var(--accent-red)';
                
                updateUI(packet);

                const currentShindo = packet.MaxIntensity || "-";
                const serial = parseInt(packet.Serial) || 1;
                const isFinal = packet.isFinal || false;

                if (packet.EventID !== lastIssueId || serial === 1) {
                    lastIssueId = packet.EventID;
                    triggerSound('quake1');
                    speakAlert(`緊急地震速報。${packet.Hypocenter}で最大震度${currentShindo}の地震が発生。`);

                    // Play specific intensity sound profile directly 
                    playShindoSound(currentShindo);
                } 
                else if (serial > lastSerial && !isFinal) {
                    triggerSound('update');
                }

                if (isFinal) {
                    triggerSound('updatef');
                }
                lastSerial = serial;
            };

            wolfx.onclose = () => {
                document.getElementById('status-node').classList.remove('connected');
                setTimeout(connectWebSockets, 5000); 
            };

            const p2p = new WebSocket('wss://api.p2pquake.net/v2/ws');
            p2p.onmessage = (e) => {
                const raw = JSON.parse(e.data);
                if (raw.code === 551) {
                    triggerSound('info');
                }
                if (raw.code === 552) {
                    const banner = document.getElementById('tsunami-alert');
                    if (raw.cancelled) {
                        banner.innerText = "津波警報・注意報は解除されました";
                        banner.style.background = "#2f3542";
                        triggerSound('tsunami_cancel'); 
                    } else {
                        banner.style.background = 'var(--accent-red)';
                        const hasMajor = raw.areas && raw.areas.some(a => a.grade === "MajorWarning");
                        if (hasMajor) {
                            banner.innerText = "大津波警報 発令中";
                            triggerSound('tsunami_major'); 
                        } else {
                            banner.innerText = "津波警報・注意報 発令中";
                            triggerSound('tsunami_warn');  
                        }
                    }
                }
            };
        }

        function runClock() {
            setInterval(() => {
                const d = new Date();
                const pad = (n) => String(n).padStart(2, '0');
                document.getElementById('live-clock').innerText = 
                    `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
            }, 1000);
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            bootLatestData();
            connectWebSockets();
            runClock();
            drawMapLoop();
            
            fetchNiedData();
            setInterval(fetchNiedData, 2000); // 2-second real-time intervals
